<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="./Navbar.css">
    <link

        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    >
</head>
<body>
    <nav aria-label="Main navigation">
        <div class="nav__logo">
            <a href="../Landing_Page/LandingPage.html">
                StayHealthy
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="26"
                    height="26"
                    viewBox="0 0 1000 1000"
                    aria-hidden="true"
                >
                    <!-- Testa -->
                    <path d="
                        M499.8,10
                        c91.7,0,166,74.3,166,166
                        s-74.3,166-166,166
                        s-166-74.3-166-166
                        S408.1,10,499.8,10Z
                    " />

                    <!-- Colletto -->
                    <path d="
                        M499.8,522.8
                        c71.2,0,129.1-58.7,129.1-129.1
                        H370.6
                        C370.6,464.1,428.6,522.8,499.8,522.8Z
                    " />

                    <!-- Busto con stetoscopio ricostruito -->
                    <path d="
                        M693.2,395
                        c-0.7,94.9-70.3,173.7-160.8,188.9
                        v155.9
                        c0,80.3-60.7,150.8-140.8,155.3
                        c-83,4.7-152.7-58.9-157.6-139.7
                        c-22-12.8-35.6-38.5-30.3-66.7
                        c4.7-25.1,25.5-45.6,50.8-49.9
                        c39.7-6.7,74.1,23.7,74.1,62.1
                        c0,23-12.3,43-30.7,54.1
                        c4.7,45.4,45.1,80.4,92.6,76
                        c44.6-4,77.2-44,77.2-90.8
                        V583.9
                        C377.2,568.7,307.6,489.9,306.9,395
                        C184,425,100,535,100,670
                        V990
                        H900
                        V670
                        C900,535,816.1,425,693.2,395Z
                    " />
                </svg>
            </a>
            <span>.</span>
        </div>

        <button
            class="nav__icon"
            type="button"
            aria-label="Open menu"
            aria-controls="navigation-links"
            aria-expanded="false"
            onclick="handleClick()"
        >
            <i class="fa fa-bars" aria-hidden="true"></i>
        </button>

        <ul class="nav__links" id="navigation-links">
            <li class="link">
                <a href="../Landing_Page/LandingPage.html">Home</a>
            </li>
            <li class="link">
                <a href="#">Appointments</a>
            </li>
            <li class="link">
                <a class="btn1" href="../Sign_Up/Sign_Up.html">Sign Up</a>
            </li>
            <li class="link">
                <a class="btn1" href="../Login/Login.html">Login</a>
            </li>
        </ul>
    </nav>

    <script>
        function handleClick() {
            const navLinks = document.querySelector(".nav__links");
            const navButton = document.querySelector(".nav__icon");
            const navIcon = navButton.querySelector("i");

            const isOpen = navLinks.classList.toggle("active");

            navButton.setAttribute("aria-expanded", String(isOpen));
            navButton.setAttribute(
                "aria-label",
                isOpen ? "Close menu" : "Open menu"
            );

            navIcon.classList.toggle("fa-bars", !isOpen);
            navIcon.classList.toggle("fa-times", isOpen);
        }
    </script>
</body>
</html>
